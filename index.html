<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --prompt:  #f78166;
    --cmd:     #e6edf3;
    --output:  #8b949e;
    --green:   #3fb950;
    --blue:    #58a6ff;
    --yellow:  #d29922;
    --orange:  #f0883e;
    --dim:     #484f58;
    --titlebar:#161b22;
  }
  [data-theme="light"] {
    --bg:      #ffffff;
    --surface: #f6f8fa;
    --border:  #d0d7de;
    --prompt:  #cf222e;
    --cmd:     #1f2328;
    --output:  #57606a;
    --green:   #1a7f37;
    --blue:    #0969da;
    --yellow:  #9a6700;
    --orange:  #bc4c00;
    --dim:     #afb8c1;
    --titlebar:#f6f8fa;
  }

  body {
    background: var(--bg);
    color: var(--cmd);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    transition: background 0.25s, color 0.25s;
  }
  [data-theme="dark"] body::before, body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 3px);
    pointer-events: none; z-index: 9999;
  }
  [data-theme="light"] body::before { display: none; }

  .window {
    width: 100%; max-width: 820px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 70px rgba(0,0,0,0.7);
    transition: background 0.25s, border-color 0.25s;
  }
  [data-theme="light"] .window { box-shadow: 0 8px 32px rgba(0,0,0,0.12); }

  .titlebar {
    background: var(--titlebar);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 10px 16px; gap: 9px;
    transition: background 0.25s, border-color 0.25s;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }
  .tlabel { flex: 1; text-align: center; color: var(--output); font-size: 12px; }

  .titlebar-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .theme-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--output); cursor: pointer; user-select: none; }
  .theme-toggle .icon { font-size: 13px; line-height: 1; }
  .toggle-track {
    width: 32px; height: 17px; background: var(--border);
    border-radius: 9px; position: relative;
    transition: background 0.2s; cursor: pointer;
    border: 1px solid var(--dim);
  }
  .toggle-track.on { background: var(--green); border-color: var(--green); }
  .toggle-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; background: #fff;
    border-radius: 50%; transition: left 0.2s;
  }
  .toggle-track.on .toggle-thumb { left: 17px; }

  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; font-size: 11px; }
  .lang-btn { padding: 2px 7px; background: none; border: none; color: var(--dim); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; transition: background 0.15s, color 0.15s; }
  .lang-btn.active { background: var(--green); color: #000; }
  .lang-btn:not(.active):hover { color: var(--output); }
  .ctrl-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }

  .term { padding: 25px 30px 35px; }

  .header-row { display: flex; align-items: center; gap: 30px; margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px solid var(--border); }
  .avatar-wrap { width: 120px; height: 120px; flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); overflow: hidden; }
  .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .hname  { font-size: 28px; font-weight: 700; color: var(--cmd); line-height: 1; }
  .htitle { font-size: 14px; font-weight: 500; color: var(--green); margin-top: 4px; }
  .hloc   { font-size: 13px; color: var(--output); margin-top: 4px; }

  .pline { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; opacity: 0; transition: opacity 0.1s; }
  .pline.show { opacity: 1; }
  .ps1  { color: var(--prompt); font-size: 15px; font-weight: 700; }
  .pcmd { color: var(--cmd); font-size: 14px; }
  .cur  { display: inline-block; width: 8px; height: 16px; background: var(--cmd); animation: blink 1s step-start infinite; margin-left: 2px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .oblock { margin-bottom: 22px; opacity: 0; transform: translateY(5px); transition: opacity 0.25s, transform 0.25s; }
  .oblock.show { opacity: 1; transform: none; }
  .oline { color: var(--output); font-size: 13px; line-height: 1.7; }
  .oline.w { color: var(--cmd); font-weight: 500; }
  .oline.g { color: var(--green); }

  .pbox { border: 1px solid var(--border); border-left: 4px solid var(--orange); background: var(--surface); padding: 15px 20px; margin: 10px 0 20px; border-radius: 4px; transition: background 0.25s, border-color 0.25s; }
  .pbox.nda { border-left-color: #f78166; }
  .ptitle { color: var(--orange); font-size: 15px; font-weight: 700; }
  .pbox.nda .ptitle { color: #f78166; }
  .prole  { color: var(--yellow); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .tag { background: rgba(88,166,255,0.1); border: 1px solid rgba(88,166,255,0.2); color: var(--blue); font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 6px; display: inline-block; margin-top: 5px; }
  .tag.nda-tag { background: rgba(247,129,102,0.1); border-color: rgba(247,129,102,0.3); color: #f78166; }

  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 10px; }
  .p-card { border: 1px solid var(--border); background: var(--surface); border-radius: 4px; overflow: hidden; cursor: pointer; display: block; transition: border-color 0.2s, transform 0.15s, background 0.25s; }
  .p-card:hover { border-color: var(--blue); transform: translateY(-2px); }
  .p-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; filter: grayscale(30%); transition: filter 0.2s; }
  .p-card:hover img { filter: grayscale(0%); }
  .p-card-info  { padding: 10px 12px; }
  .p-card-title { color: var(--cmd); font-size: 13px; line-height: 1.3; font-weight: 500; }
  .p-card-meta  { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .p-card-arrow { color: var(--blue); font-size: 11px; margin-top: 4px; }

  .clinks { display: flex; flex-wrap: wrap; gap: 8px 30px; margin-top: 5px; }
  .clinks a { color: var(--blue); text-decoration: none; font-size: 13px; }
  .clinks a:hover { text-decoration: underline; }
  .clinks a::before { content: "-> "; color: var(--dim); }
  .dl-btn { display: inline-block; background: rgba(240,136,62,0.1); border: 1px solid var(--orange); color: var(--orange); padding: 5px 15px; border-radius: 4px; text-decoration: none; margin-top: 10px; transition: 0.2s; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .dl-btn:hover { background: var(--orange); color: #000; }

  #detail-view { position: fixed; inset: 0; background: var(--bg); z-index: 200; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background 0.25s; }
  #detail-view.open { transform: translateX(0); }
  .detail-bar { background: var(--titlebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 12px 20px; gap: 14px; flex-shrink: 0; transition: background 0.25s, border-color 0.25s; }
  .detail-dots { display: flex; gap: 7px; }
  .back-btn { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--prompt); background: rgba(247,129,102,0.08); border: 1px solid rgba(247,129,102,0.3); border-radius: 4px; padding: 3px 12px; cursor: pointer; transition: background 0.15s; flex-shrink: 0; }
  .back-btn:hover { background: rgba(247,129,102,0.18); color: var(--cmd); }
  .detail-bar-cmd { color: var(--output); font-size: 12px; flex: 1; text-align: center; }
  .detail-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .detail-inner { max-width: 820px; margin: 0 auto; padding: 28px 30px 50px; }
  .detail-title-big { font-size: 24px; font-weight: 700; color: var(--orange); line-height: 1.1; margin-bottom: 4px; }
  .detail-role-line { font-size: 14px; font-weight: 500; color: var(--yellow); margin-bottom: 3px; }
  .detail-meta-line { font-size: 12px; color: var(--dim); margin-bottom: 14px; }
  .detail-desc { font-size: 13px; color: var(--output); line-height: 1.8; margin-bottom: 14px; max-width: 680px; }
  .detail-tags { margin-bottom: 26px; }
  .detail-img-wrap { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 28px; background: var(--surface); transition: background 0.25s, border-color 0.25s; }
  .detail-img-wrap img { width: 100%; display: block; }
  .detail-img-placeholder { padding: 40px 30px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.8; }
  .detail-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 4px; }
  .behance-link { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--blue); text-decoration: none; }
  .behance-link::before { content: "-> "; color: var(--dim); }
  .behance-link:hover { text-decoration: underline; }
  .detail-nav { display: flex; gap: 10px; }
  .nav-btn { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: rgba(88,166,255,0.08); border: 1px solid rgba(88,166,255,0.25); color: var(--blue); padding: 3px 16px; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
  .nav-btn:hover:not(:disabled) { background: rgba(88,166,255,0.18); }
  .nav-btn:disabled { opacity: 0; pointer-events: none; }

  @media (max-width: 600px) {
    .header-row { flex-direction: column; text-align: center; }
    .portfolio-grid { grid-template-columns: 1fr 1fr; }
    .detail-inner { padding: 20px 16px 40px; }
    .detail-footer { flex-direction: column; align-items: flex-start; }
    .tlabel { display: none; }
  }
</style>
</head>

// ── LANG ──────────────────────────────────────────────────────
var _lang = "en";
function setLang(lang) {
  _lang = lang;
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("btn-es").classList.toggle("active", lang === "es");
  document.documentElement.lang = lang;
  buildTerminal();
}

// ── DETAIL ────────────────────────────────────────────────────
var currentIdx = 0;
function openDetail(idx) {
  currentIdx = idx;
  var p = PROJECTS[idx];
  var s = STRINGS[_lang];
  var isEs = _lang === "es";
  document.getElementById("detail-bar-cmd").textContent = "❯ cat portfolio/" + p.id + ".md";
  document.getElementById("d-title").textContent = p.title;
  document.getElementById("d-role").textContent  = p.role;
  document.getElementById("d-meta").textContent  = p.meta;
  document.getElementById("d-desc").textContent  = isEs ? p.desc_es : p.desc;
  var tagsArr = isEs ? p.tags_es : p.tags;
  document.getElementById("d-tags").innerHTML = tagsArr.map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
  var imgWrap = document.getElementById("d-img-wrap");
  imgWrap.innerHTML = '<img src="'+p.img+'" alt="'+p.title+'" onerror="this.parentNode.innerHTML=\'<div class=\\\"detail-img-placeholder\\\">Screenshot not found locally.<br>Save <strong>'+p.img+'</strong> to your repo,<br>or <a href=\\\"'+p.behance+'\\\" target=\\\"_blank\\\" style=\\\"color:var(--blue)\\\">view on Behance</a>.</div>\'">';
  document.getElementById("d-behance").href = p.behance;
  document.getElementById("d-behance").textContent = s.view_behance;
  document.querySelector(".back-btn").textContent = s.back_btn;
  document.getElementById("nav-prev").disabled = (idx === 0);
  document.getElementById("nav-next").disabled = (idx === PROJECTS.length - 1);
  document.getElementById("detail-body").scrollTop = 0;
  document.getElementById("detail-view").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  document.getElementById("detail-view").classList.remove("open");
  document.body.style.overflow = "";
}
function navigateProject(dir) {
  var next = currentIdx + dir;
  if (next >= 0 && next < PROJECTS.length) openDetail(next);
}
document.addEventListener("keydown", function(e) {
  if (!document.getElementById("detail-view").classList.contains("open")) return;
  if (e.key === "Escape")    closeDetail();
  if (e.key === "ArrowLeft") navigateProject(-1);
  if (e.key === "ArrowRight")navigateProject(1);
});

// ── TERMINAL ──────────────────────────────────────────────────
var termEl = document.getElementById("term");
var wait = function(ms){ return new Promise(function(r){ setTimeout(r,ms); }); };

function typeInto(el, text) {
  return new Promise(function(resolve) {
    var i = 0;
    function tick() {
      if (i < text.length) { el.textContent += text.charAt(i++); setTimeout(tick, 22 + Math.random()*18); }
      else resolve();
    }
    tick();
  });
}

function makePromptLine() {
  var line = document.createElement("div");
  line.className = "pline";
  line.innerHTML = '<span class="ps1">❯</span> <span class="pcmd"></span><span class="cur"></span>';
  termEl.appendChild(line);
  return { line: line, cmd: line.querySelector(".pcmd"), cur: line.querySelector(".cur") };
}

async function runCmd(text, cb) {
  var p = makePromptLine();
  await wait(180);
  p.line.classList.add("show");
  await typeInto(p.cmd, text);
  await wait(130);
  p.cur.remove();
  var ob = document.createElement("div");
  ob.className = "oblock";
  termEl.appendChild(ob);
  cb(ob);
  requestAnimationFrame(function(){ ob.classList.add("show"); });
  await wait(500);
}

async function buildTerminal() {
  var s = STRINGS[_lang];
  document.getElementById("hname").textContent  = "";
  document.getElementById("htitle").textContent = "";
  document.getElementById("hloc").textContent   = "";
  termEl.innerHTML = "";

  await typeInto(document.getElementById("hname"),  "ÁLEX MÉNDEZ");
  await typeInto(document.getElementById("htitle"), s.htitle);
  await typeInto(document.getElementById("hloc"),   s.hloc);
  await wait(350);

  await runCmd("whoami", function(o) {
    o.innerHTML = '<div class="oline w">ÁLEX MÉNDEZ</div>' +
      '<div class="oline g">'+s.htitle+'</div>' +
      '<div class="oline">'+s.hloc+' &nbsp;·&nbsp; '+s.open+'</div>';
  });

  await runCmd(s.about_cmd, function(o) {
    o.innerHTML = s.about.map(function(line, i) {
      var style = i === s.about.length - 1 ? ' style="margin-top:6px;color:var(--dim)"' : '';
      return '<div class="oline"'+style+'>'+line+'</div>';
    }).join("");
  });

  await runCmd(s.work_cmd, function(o) {
    s.work.forEach(function(p) {
      var ndaNote = p.nda ? '<div class="oline" style="margin-top:8px;color:#f78166;">'+p.nda_note+'</div>' : "";
      o.innerHTML += '<div class="pbox'+(p.nda?" nda":"")+'">' +
        '<div class="ptitle">'+p.t+'</div>' +
        '<div class="prole">'+p.r+'</div>' +
        '<div class="oline">'+p.d+'</div>' +
        ndaNote +
        '<div>'+p.tags.map(function(t){ return '<span class="tag'+(p.nda?" nda-tag":"")+'">'+t+'</span>'; }).join("")+'</div>' +
        '</div>';
    });
  });

  await runCmd(s.portfolio_cmd, function(o) {
    o.innerHTML = '<div class="oline" style="margin-bottom:12px;">→ <a href="https://www.behance.net/amendez" target="_blank" rel="noopener" style="color:var(--blue)">behance.net/amendez</a></div>';
    var grid = document.createElement("div");
    grid.className = "portfolio-grid";
    PROJECTS.forEach(function(p, idx) {
      var card = document.createElement("div");
      card.className = "p-card";
      card.setAttribute("role","button");
      card.setAttribute("tabindex","0");
      card.onclick = function(){ openDetail(idx); };
      card.onkeydown = function(e){ if(e.key==="Enter"||e.key===" ") openDetail(idx); };
      card.innerHTML = '<img src="'+p.thumb+'" alt="'+p.title+'" loading="lazy">' +
        '<div class="p-card-info">' +
        '<div class="p-card-title">'+p.title+'</div>' +
        '<div class="p-card-meta">'+p.meta.split("·")[0].trim()+'</div>' +
        '<div class="p-card-arrow">'+s.view_project+'</div>' +
        '</div>';
      grid.appendChild(card);
    });
    o.appendChild(grid);
  });

  await runCmd(s.downloads_cmd, function(o) {
    o.innerHTML = '<div class="oline">'+s.downloads_label+'</div>' +
      '<a href="CV.pdf" download="CV_Alex_Mendez_2026.pdf" class="dl-btn">'+s.download_btn+'</a>';
  });

  await runCmd(s.contact_cmd, function(o) {
    o.innerHTML = '<div class="clinks">' +
      '<a href="https://linkedin.com/in/amendez83" target="_blank" rel="noopener">linkedin.com/in/amendez83</a>' +
      '<a href="https://behance.net/amendez" target="_blank" rel="noopener">behance.net/amendez</a>' +
      '<a href="mailto:amendez83@gmail.com">amendez83@gmail.com</a>' +
      '</div>';
  });

  var last = makePromptLine();
  last.line.classList.add("show");
}

window.addEventListener("DOMContentLoaded", function(){ buildTerminal(); });
</script>
